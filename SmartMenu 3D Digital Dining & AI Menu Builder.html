  <style>
    :root {
      --accent: #e11d48;
      --bg: #0b0d12;
      --card: #151922;
      --card-2: #1f2430;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #2a303d;
    }
    body.light-theme {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-2: #f1f5f9;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
    }
    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.2s, color 0.2s;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    model-viewer {
      width: 100%;
      height: 245px;
      border-radius: 0.75rem;
      background: radial-gradient(circle at center, #1e2536 0%, #080a0e 100%);
      --poster-color: transparent;
    }
    .theme-card {
      background-color: var(--card);
      border-color: var(--border);
    }
    .theme-card-2 {
      background-color: var(--card-2);
      border-color: var(--border);
    }
    .theme-muted {
      color: var(--muted);
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printableQrArea, #printableQrArea * {
        visibility: visible;
      }
      #printableQrArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white !important;
        color: black !important;
      }
    }
  </style>
</head>

  <!-- Inline Self-Contained PWA Manifest & Service Worker -->
  <script>
    (function setupInlinePWA() {
      try {
        const manifest = {
          name: "SmartMenu 3D Dining",
          short_name: "SmartMenu",
          start_url: location.href,
          display: "standalone",
          background_color: "#0b0d12",
          theme_color: "#e11d48",
          icons: [{
            src: "https://cdn-icons-png.flaticon.com/512/3448/3448609.png",
            sizes: "512x512",
            type: "image/png"
          }]
        };
        const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(mBlob);
        document.head.appendChild(link);

        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
          const swCode = `
            self.addEventListener('install', e => self.skipWaiting());
            self.addEventListener('activate', e => e.waitUntil(clients.claim()));
            self.addEventListener('fetch', e => {
              if (e.request.method !== 'GET') return;
              e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
            });
          `;
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
      } catch (e) {}
    })();
  </script>

    function autoMatchPhotoAndVeg(dishName) {
      const lower = (dishName || '').toLowerCase();
      const isNonVegKeyword = ['chicken', 'mutton', 'fish', 'prawn', 'egg', 'beef', 'keema', 'non-veg', 'non veg'].some(w => lower.includes(w));
      for (const entry of SMART_PHOTO_LIBRARY) {
        if (entry.keys.some(k => lower.includes(k))) {
          return {
            photo: entry.photo,
            veg: isNonVegKeyword ? false : entry.veg
          };
        }
      }
      return {
        photo: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500',
        veg: !isNonVegKeyword
      };
    }

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const restId = (params.get('r') || 'demo-cafe').trim();
    const tableNo = (params.get('t') || '1').trim();
    const panelMode = (params.get('panel') || 'customer').trim(); // customer | staff | superadmin

    const $hdrActions = document.getElementById('hdrActions');

    const $bottomNavInner = document.getElementById('bottomNavInner');

    // Non-blocking Toast Notification Helper
    let toastTimer = null;
    function showToast(msg, type = 'success') {
      const banner = document.getElementById('toastBanner');
      const dot = document.getElementById('toastDot');
      const text = document.getElementById('toastText');
      text.textContent = msg;
      dot.className = `w-2.5 h-2.5 rounded-full shrink-0 ${
        type === 'error' ? 'bg-rose-500' : type === 'warn' ? 'bg-amber-400' : 'bg-emerald-400'
      }`;
      banner.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => banner.classList.add('hidden'), 3600);
    }
    document.getElementById('toastCloseBtn').onclick = () => document.getElementById('toastBanner').classList.add('hidden');

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Hidden 4.5-second press-and-hold on the restaurant header title for staff recovery
    let pressTimer = null;
    $hdrTitle.addEventListener('pointerdown', () => {
      if (panelMode !== 'customer') return;
      pressTimer = setTimeout(() => {
        location.href = `${location.pathname}?r=${encodeURIComponent(restId)}&panel=staff`;
      }, 4500);
    });
    $hdrTitle.addEventListener('pointerup', () => clearTimeout(pressTimer));
    $hdrTitle.addEventListener('pointerleave', () => clearTimeout(pressTimer));

    function showError(err) {
      $app.innerHTML = `
        <div class="theme-card border border-rose-500/60 rounded-2xl p-5">
          <h3 class="text-base font-bold text-rose-400">Connection / Setup Notice</h3>
          <p class="text-sm theme-muted mt-1.5">${escapeHtml(err?.message || String(err))}</p>
        </div>
      `;
    }

    function setAccent(hex) {
      if (hex) document.documentElement.style.setProperty('--accent', hex);
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = 880;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.22);
      } catch (e) {}
    }

    async function boot() {
      try {
        if (panelMode === 'superadmin') {
          renderSuperAdminGate();
          return;
        }

        await ensureDemoExists();

        const restSnap = await getDoc(doc(db, 'restaurants', restId));
        if (!restSnap.exists()) {
          $app.innerHTML = `
            <div class="theme-card border rounded-2xl p-6 text-center">
              <h3 class="text-lg font-bold">Restaurant Not Found</h3>
              <p class="text-sm theme-muted mt-1">Please scan a valid table QR code.</p>
            </div>
          `;
          return;
        }
        restaurantData = { id: restSnap.id, ...restSnap.data() };
        setAccent(restaurantData.accent_color);

        if (restaurantData.active === false && panelMode === 'customer') {
          $hdrTitle.textContent = restaurantData.name;
          $app.innerHTML = `
            <div class="theme-card border rounded-2xl p-6 text-center">
              <h3 class="text-lg font-bold">Menu Temporarily Unavailable</h3>
              <p class="text-sm theme-muted mt-1">Please ask staff for assistance.</p>
            </div>
          `;
          return;
        }

        onSnapshot(collection(db, 'restaurants', restId, 'menu'), (snap) => {
          menuItems = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (panelMode === 'customer') renderCustomerMenu();
          if (panelMode === 'staff' && unlockedRole) renderStaffWorkspace();
        }, showError);

        const qOrders = query(collection(db, 'restaurants', restId, 'orders'), orderBy('created_ms', 'desc'));
        onSnapshot(qOrders, (snap) => {
          const incoming = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          if (panelMode === 'staff' && unlockedRole && lastKnownOrderCount !== -1 && incoming.length > lastKnownOrderCount) {
            playBeep();
            showToast('New order / table request arrived!', 'warn');
          }
          lastKnownOrderCount = incoming.length;
          liveOrders = incoming;
          if (panelMode === 'customer') renderCustomerMenu();
          if (panelMode === 'staff' && unlockedRole) renderStaffWorkspace();
        }, showError);

        if (panelMode === 'staff') {
          if (!unlockedRole) renderStaffPinGate();
          else renderStaffWorkspace();
        } else {
          renderCustomerMenu();
        }
      } catch (err) {
        showError(err);
      }
    }

    // ================= 1. STRICTLY ISOLATED CUSTOMER UI/UX =================
    const TABLE_QUICK_REQUESTS = [
      { label: '💧 Water Bottle', item: 'Water Bottle', isBill: false },
      { label: '🥣 Extra Curd / Raita', item: 'Extra Curd / Raita', isBill: false },
      { label: '🍋 Finger Bowl', item: 'Finger Bowl', isBill: false },
      { label: '🍨 Sweet / Dessert', item: 'Sweet / Paan', isBill: false },
      { label: '🍲 Hot Soup', item: 'Hot Soup', isBill: false },
      { label: '🙋 Call Waiter', item: 'Waiter Assistance', isBill: false },
      { label: '🧾 Bring Bill', item: 'Bring Final Bill', isBill: true }
    ];

    function renderCustomerMenu() {
      // Strictly hide staff navigation in customer mode
      $bottomNav.classList.add('hidden');
      $bottomNavInner.innerHTML = '';

      $hdrTitle.textContent = restaurantData.name;
      $hdrSub.textContent = 'Digital Table Menu';
      const isLight = document.body.classList.contains('light-theme');
      $hdrActions.innerHTML = `
        <span class="px-2.5 py-1 rounded-full theme-card-2 border text-xs font-bold">Table ${escapeHtml(tableNo)}</span>
        <button id="themeToggleBtn" class="px-2.5 py-1.5 rounded-xl theme-card-2 border text-xs font-semibold" title="Switch Theme">${isLight ? '🌙' : '☀️'}</button>
        <button id="openServiceBtn" class="px-3 py-1.5 rounded-xl theme-card-2 border text-xs font-bold">Table Help</button>
      `;

      document.getElementById('themeToggleBtn').onclick = () => {
        document.body.classList.toggle('light-theme');
        renderCustomerMenu();
      };
      document.getElementById('openServiceBtn').onclick = () => openServiceModal();

      const tableOrders = liveOrders.filter(o => String(o.table_no) === String(tableNo));
      const openOrders = tableOrders.filter(o => o.status !== 'CLOSED');
      const allFinished = tableOrders.length > 0 && openOrders.length === 0;
      const anyReadyOrServed = openOrders.some(o => o.status === 'READY' || o.status === 'SERVED');

      // 1) Live 3-Step Order Progress Card
      let trackerHtml = '';
      if (openOrders.length) {
        const latest = openOrders[0];
        const st = latest.status;
        const s1 = 'bg-emerald-500/20 text-emerald-400 border-emerald-500';
        const s2 = (st === 'PREPARING' || st === 'READY' || st === 'SERVED')
          ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500'
          : 'bg-blue-500/25 text-blue-400 border-blue-500';
        const s3 = (st === 'READY' || st === 'SERVED')
          ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500'
          : (st === 'PREPARING' ? 'bg-blue-500/25 text-blue-400 border-blue-500' : 'theme-card-2 theme-muted');
        const tableRunningTotal = openOrders.reduce((sum, o) => sum + Number(o.total || 0), 0);

        trackerHtml = `
          <div class="theme-card border-2 border-blue-500 rounded-2xl p-4 mb-4 shadow-lg">
            <div class="flex items-center justify-between gap-2">
              <strong class="text-sm font-bold">Table ${escapeHtml(tableNo)} Live Order</strong>
              <span class="text-xs theme-muted">Running Bill: <strong class="text-sm">₹${tableRunningTotal}</strong></span>
            </div>
            <div class="grid grid-cols-3 gap-1.5 my-2.5">
              <div class="text-center py-1.5 px-1 rounded-lg text-[11px] font-bold border ${s1}">1. Sent</div>
              <div class="text-center py-1.5 px-1 rounded-lg text-[11px] font-bold border ${s2}">2. Cooking</div>
              <div class="text-center py-1.5 px-1 rounded-lg text-[11px] font-bold border ${s3}">3. Ready / Served</div>
            </div>
            <div class="text-xs theme-muted">
              Latest: ${latest.items.map(i => `${escapeHtml(i.name)} ×${i.qty}`).join(', ')}
            </div>
          </div>
        `;
      }

      // 2) 1-Tap Table Concierge & Finishing Touches Strip
      const conciergeHtml = `
        <div class="theme-card border rounded-2xl p-4 mb-4">
          <div class="flex items-center justify-between gap-2 mb-2.5">
            <strong class="text-sm font-bold">Need Anything at Table ${escapeHtml(tableNo)}?</strong>
            <span class="text-[11px] theme-muted">1-Tap Waiter Alert</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            ${TABLE_QUICK_REQUESTS.map((req, idx) => `
              <button data-qreq="${idx}" class="px-2.5 py-2.5 rounded-xl theme-card-2 border text-xs font-semibold text-center transition active:scale-95 ${
                req.isBill ? 'border-amber-500/70 text-amber-400' : ''
              }">
                ${req.label}
              </button>
            `).join('')}
          </div>
        </div>
      `;

      // 3) Post-Meal Google Review Card
      let reviewHtml = '';
      if ((allFinished || anyReadyOrServed) && restaurantData.google_review_url) {
        reviewHtml = `
          <div class="bg-gradient-to-r from-emerald-500/20 to-blue-500/20 border border-emerald-500/50 rounded-2xl p-4 mb-4 text-center">
            <div class="font-extrabold text-base">Finished Your Meal?</div>
            <div class="text-xs theme-muted mt-1 mb-3">Your feedback helps ${escapeHtml(restaurantData.name)} serve you even better!</div>
            <a href="${escapeHtml(restaurantData.google_review_url)}" target="_blank" rel="noopener" class="inline-block px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white shadow">
              ⭐ Rate Your Experience on Google
            </a>
          </div>
        `;
      }

      // 4) 3D Signature Dish Showcase (Only dishes with a real glb_url attached!)
      const availableMenu = menuItems.filter(m => m.in_stock !== false);
      const heroes = availableMenu.filter(m => Boolean(m.glb_url));
      if (heroIdx >= heroes.length) heroIdx = 0;
      const hero = heroes[heroIdx];

      const heroHtml = hero ? `
        <section class="mb-5">
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-xs font-bold uppercase tracking-wider theme-muted">3D Signature Dish (Drag to Rotate)</h2>
            <span class="text-[11px] text-sky-400 font-semibold">${heroes.length} 3D item${heroes.length > 1 ? 's' : ''}</span>
          </div>
          <div class="bg-gradient-to-br from-[#1b202c] to-[#11141b] text-white border border-slate-800 rounded-2xl p-3.5 shadow-xl">
            <model-viewer src="${escapeHtml(hero.glb_url)}" alt="${escapeHtml(hero.name)}" camera-controls auto-rotate shadow-intensity="1" ar></model-viewer>
            <div class="flex items-center justify-between gap-3 mt-3 pt-2.5 border-t border-slate-800">
              <div class="min-w-0">
                <div class="font-bold text-sm sm:text-base truncate">${escapeHtml(hero.name)} • ₹${hero.price}</div>
                <div class="text-xs text-slate-400 truncate">${escapeHtml(hero.description || hero.category)}</div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                ${heroes.length > 1 ? `<button id="nextHeroBtn" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-white">Next 3D</button>` : ''}
                <button data-add="${hero.id}" class="px-4 py-2 rounded-xl text-xs font-bold text-white shadow" style="background: var(--accent);">+ Add</button>
              </div>
            </div>
          </div>
        </section>
      ` : '';

      // 5) Search + Category Filters + Menu Cards
      const cats = ['All', ...new Set(availableMenu.map(i => i.category).filter(Boolean))];
      const qLower = searchTerm.toLowerCase();
      const filtered = availableMenu.filter(i => {
        const catOk = selectedCat === 'All' || i.category === selectedCat;
        const vegOk = !vegOnly || i.veg;
        const searchOk = !qLower || i.name.toLowerCase().includes(qLower) || (i.description || '').toLowerCase().includes(qLower);
        return catOk && vegOk && searchOk;
      });

      $app.innerHTML = `
        ${reviewHtml}
        ${trackerHtml}
        ${conciergeHtml}
        ${heroHtml}
        <section>
          <div class="flex items-center justify-between mb-2">
            <h2 class="text-xs font-bold uppercase tracking-wider theme-muted">Explore Menu</h2>
            <span class="text-xs theme-muted">${filtered.length} dishes</span>
          </div>
          <input id="menuSearchInput" type="text" placeholder="Search dishes (e.g., biryani, burger, coffee)..." value="${escapeHtml(searchTerm)}" class="w-full px-3.5 py-2.5 rounded-xl theme-card border text-sm mb-2.5 focus:outline-none" />
          <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2">
            <button id="vegChip" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold border transition ${
              vegOnly ? 'bg-emerald-600 border-emerald-500 text-white' : 'theme-card theme-muted'
            }">
              🟢 Veg Only
            </button>
            ${cats.map(c => `
              <button data-cat="${escapeHtml(c)}" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-bold border transition ${
                selectedCat === c ? 'text-white border-transparent' : 'theme-card theme-muted'
              }" style="${selectedCat === c ? 'background: var(--accent);' : ''}">
                ${escapeHtml(c)}
              </button>
            `).join('')}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 mt-3">
            ${filtered.map(item => {
              const q = cart[item.id]?.qty || 0;
              return `
                <div class="theme-card border rounded-2xl p-3.5 flex flex-col justify-between gap-2.5 relative">
                  <div>
                    ${item.glb_url ? `<button data-view3d="${item.id}" class="absolute top-5 right-5 bg-slate-900/90 text-sky-400 border border-sky-400/50 px-2.5 py-1 rounded-full text-[11px] font-extrabold shadow">3D View</button>` : ''}
                    ${item.photo_url ? `
                      <img
                        src="${escapeHtml(item.photo_url)}"
                        alt="${escapeHtml(item.name)}"
                        loading="lazy"
                        onerror="this.src='https://placehold.co/400x260/1f2430/94a3b8?text=${encodeURIComponent(item.name)}'"
                        class="w-full h-36 object-cover rounded-xl theme-card-2 mb-2.5"
                      />` : ''}
                    <div class="flex items-center justify-between gap-2">
                      <span class="inline-flex items-center gap-1.5 text-[11px] font-semibold ${item.veg ? 'text-emerald-400' : 'text-rose-400'}">
                        <span class="w-2.5 h-2.5 rounded-full inline-block ${item.veg ? 'bg-emerald-500' : 'bg-rose-500'}"></span>
                        ${escapeHtml(item.category)}
                      </span>
                      ${item.bestseller ? `<span class="bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-md text-[10px] font-bold">Bestseller</span>` : ''}
                    </div>
                    <div class="font-bold text-sm sm:text-base mt-1">${escapeHtml(item.name)}</div>
                    ${item.description ? `<div class="text-xs theme-muted mt-0.5">${escapeHtml(item.description)}</div>` : ''}
                  </div>

                  <div class="flex items-center justify-between pt-2 border-t" style="border-color: var(--border);">
                    <strong class="text-base font-extrabold">₹${item.price}</strong>
                    ${q === 0
                      ? `<button data-add="${item.id}" class="px-4 py-1.5 rounded-xl text-xs font-bold text-white shadow transition active:scale-95" style="background: var(--accent);">+ Add</button>`
                      : `<div class="flex items-center gap-2 theme-card-2 border rounded-xl p-1">
                           <button data-dec="${item.id}" class="w-7 h-7 rounded-lg bg-slate-800 text-white font-bold text-sm">-</button>
                           <strong class="text-xs px-1.5">${q}</strong>
                           <button data-add="${item.id}" class="w-7 h-7 rounded-lg text-white font-bold text-sm" style="background: var(--accent);">+</button>
                         </div>`
                    }
                  </div>
                </div>
              `;
            }).join('') || '<p class="text-sm theme-muted col-span-full py-6 text-center">No matching dishes found.</p>'}
          </div>
        </section>
      `;

      const searchEl = document.getElementById('menuSearchInput');
      searchEl.oninput = (e) => {
        searchTerm = e.target.value;
        const pos = searchEl.selectionStart;
        renderCustomerMenu();
        const nextEl = document.getElementById('menuSearchInput');
        nextEl.focus();
        nextEl.setSelectionRange(pos, pos);
      };

      if (document.getElementById('nextHeroBtn')) {
        document.getElementById('nextHeroBtn').onclick = () => { heroIdx = (heroIdx + 1) % heroes.length; renderCustomerMenu(); };
      }
      document.getElementById('vegChip').onclick = () => { vegOnly = !vegOnly; renderCustomerMenu(); };
      document.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => { selectedCat = el.dataset.cat; renderCustomerMenu(); });
      document.querySelectorAll('[data-add]').forEach(el => el.onclick = () => updateCart(el.dataset.add, 1));
      document.querySelectorAll('[data-dec]').forEach(el => el.onclick = () => updateCart(el.dataset.dec, -1));
      document.querySelectorAll('[data-qreq]').forEach(el => {
        el.onclick = () => {
          const req = TABLE_QUICK_REQUESTS[Number(el.dataset.qreq)];
          triggerServiceCall(req.item);
        };
      });
      document.querySelectorAll('[data-view3d]').forEach(el => {
        el.onclick = () => open3DPreviewModal(el.dataset.view3d);
      });

      refreshCartBar();
    }

    function open3DPreviewModal(itemId) {
      const item = menuItems.find(m => m.id === itemId);
      if (!item || !item.glb_url) return;
      document.getElementById('modal3DTitle').textContent = `${item.name} • ₹${item.price}`;
      document.getElementById('modal3DBody').innerHTML = `
        <model-viewer src="${escapeHtml(item.glb_url)}" alt="${escapeHtml(item.name)}" camera-controls auto-rotate shadow-intensity="1" ar style="height:280px;"></model-viewer>
        <p class="text-xs theme-muted my-3">${escapeHtml(item.description || 'Drag with one finger to rotate 360°.')}</p>
        <button id="modal3DAddBtn" class="w-full py-3 rounded-xl font-bold text-sm text-white shadow" style="background: var(--accent);">+ Add to Order (₹${item.price})</button>
      `;
      document.getElementById('modal3DAddBtn').onclick = () => {
        updateCart(item.id, 1);
        closeModal('preview3DModal');
      };
      openModal('preview3DModal');
    }
    document.getElementById('close3DBtn').onclick = () => closeModal('preview3DModal');

    function openServiceModal() {
      const grid = document.getElementById('modalServiceGrid');
      grid.innerHTML = TABLE_QUICK_REQUESTS.map((req, idx) => `
        <button data-mreq="${idx}" class="px-2.5 py-2.5 rounded-xl theme-card-2 border text-xs font-semibold text-center ${
          req.isBill ? 'border-amber-500/70 text-amber-400' : ''
        }">
          ${req.label}
        </button>
      `).join('');
      grid.querySelectorAll('[data-mreq]').forEach(btn => {
        btn.onclick = () => {
          const req = TABLE_QUICK_REQUESTS[Number(btn.dataset.mreq)];
          closeModal('serviceModal');
          triggerServiceCall(req.item);
        };
      });
      openModal('serviceModal');
    }
    document.getElementById('closeServiceBtn').onclick = () => closeModal('serviceModal');
    document.getElementById('sendCustomServiceBtn').onclick = () => {
      const txt = document.getElementById('customServiceInput').value.trim();
      if (!txt) return showToast('Type what you need at your table', 'error');
      document.getElementById('customServiceInput').value = '';
      closeModal('serviceModal');
      triggerServiceCall(txt);
    };

    function openModal(id) {
      const el = document.getElementById(id);
      el.classList.remove('hidden');
      el.classList.add('flex');
    }
    function closeModal(id) {
      const el = document.getElementById(id);
      el.classList.add('hidden');
      el.classList.remove('flex');
    }

    function updateCart(id, delta) {
      const item = menuItems.find(m => m.id === id);
      if (!item) return;
      if (!cart[id]) cart[id] = { ...item, qty: 0 };
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      renderCustomerMenu();
      if (!document.getElementById('cartModal').classList.contains('hidden')) renderCartModal();
    }

    function refreshCartBar() {
      const list = Object.values(cart);
      const count = list.reduce((s, i) => s + i.qty, 0);
      const total = list.reduce((s, i) => s + i.qty * i.price, 0);
      const bar = document.getElementById('cartBar');
      if (count > 0 && panelMode === 'customer') {
        bar.classList.remove('hidden');
        document.getElementById('cartSummary').textContent = `${count} items • ₹${total}`;
      } else {
        bar.classList.add('hidden');
      }
    }

    function renderCartModal() {
      document.getElementById('modalTableSub').textContent = `Table ${tableNo} • ${restaurantData.name}`;
      const list = Object.values(cart);
      const total = list.reduce((s, i) => s + i.qty * i.price, 0);
      document.getElementById('cartList').innerHTML = list.map(i => `
        <div class="flex items-center justify-between py-2.5">
          <div>
            <strong class="text-sm">${escapeHtml(i.name)}</strong>
            <div class="text-xs theme-muted">₹${i.price} × ${i.qty}</div>
          </div>
          <div class="flex items-center gap-2">
            <button data-mdec="${i.id}" class="w-7 h-7 rounded-lg theme-card-2 border font-bold">-</button>
            <span class="text-xs font-bold">${i.qty}</span>
            <button data-madd="${i.id}" class="w-7 h-7 rounded-lg text-white font-bold" style="background: var(--accent);">+</button>
          </div>
        </div>
      `).join('') + `<div class="font-extrabold text-base pt-3">Order Total: ₹${total}</div>`;

      document.querySelectorAll('[data-madd]').forEach(el => el.onclick = () => updateCart(el.dataset.madd, 1));
      document.querySelectorAll('[data-mdec]').forEach(el => el.onclick = () => updateCart(el.dataset.mdec, -1));
    }

    document.getElementById('openCartBtn').onclick = () => {
      renderCartModal();
      openModal('cartModal');
    };
    document.getElementById('closeCartBtn').onclick = () => closeModal('cartModal');

    document.getElementById('submitOrderBtn').onclick = async () => {
      const items = Object.values(cart);
      if (!items.length) return;
      const total = items.reduce((s, i) => s + i.qty * i.price, 0);
      const btn = document.getElementById('submitOrderBtn');
      btn.disabled = true;
      btn.textContent = 'Sending to Kitchen...';

      try {
        await addDoc(collection(db, 'restaurants', restId, 'orders'), {
          table_no: String(tableNo),
          customer_name: document.getElementById('guestName').value.trim() || 'Guest',
          note: document.getElementById('orderNote').value.trim(),
          items: items.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
          total,
          status: 'NEW',
          created_ms: Date.now(),
          created_at: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
        });

        cart = {};
        document.getElementById('orderNote').value = '';
        closeModal('cartModal');
        showToast('Order sent to kitchen!', 'success');
        renderCustomerMenu();
      } catch (e) {
        showToast('Could not send order. Check connection.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Order to Kitchen';
      }
    };

    async function triggerServiceCall(label) {
      try {
        await addDoc(collection(db, 'restaurants', restId, 'orders'), {
          table_no: String(tableNo),
          customer_name: 'Table Request',
          note: label,
          items: [{ name: `🔔 ${label}`, qty: 1, price: 0 }],
          total: 0,
          status: 'NEW',
          created_ms: Date.now(),
          created_at: new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })
        });
        showToast(`Sent to staff: "${label}" for Table ${tableNo}`, 'success');
      } catch (e) {
        showToast('Could not send table alert.', 'error');
      }
    }

    // ================= 2. PIN-LOCKED STAFF & MANAGER WORKSPACE =================
    function renderStaffPinGate() {
      $hdrTitle.textContent = restaurantData.name;
      $hdrSub.textContent = 'Staff & Manager Login';
      $bottomNav.classList.add('hidden');
      $app.innerHTML = `
        <div class="max-w-md mx-auto mt-6 theme-card border rounded-3xl p-6 shadow-xl">
          <h3 class="text-lg font-bold">Enter Role PIN</h3>
          <p class="text-xs theme-muted mt-1 mb-4">Enter your Manager, Kitchen, or Waiter PIN to unlock.</p>
          <input id="staffPinInput" type="password" inputmode="numeric" placeholder="4-digit PIN" class="w-full px-4 py-3 rounded-xl theme-card-2 border text-base tracking-widest mb-4 focus:outline-none" />
          <button id="unlockStaffBtn" class="w-full py-3 rounded-xl font-bold text-sm text-white shadow-lg" style="background: var(--accent);">Unlock Panel</button>
        </div>
      `;
      const unlockFn = () => {
        const pin = document.getElementById('staffPinInput').value.trim();
        if (pin === String(restaurantData.manager_pin)) unlockedRole = 'manager';
        else if (pin === String(restaurantData.kitchen_pin)) unlockedRole = 'kitchen';
        else if (pin === String(restaurantData.waiter_pin)) unlockedRole = 'waiter';
        else return showToast('Invalid Role PIN', 'error');

        sessionStorage.setItem(`role_${restId}`, unlockedRole);
        activeTab = unlockedRole === 'waiter' ? 'tables' : 'queue';
        renderStaffWorkspace();
      };
      document.getElementById('unlockStaffBtn').onclick = unlockFn;
      document.getElementById('staffPinInput').onkeydown = (e) => { if (e.key === 'Enter') unlockFn(); };
    }

    function renderStaffWorkspace() {
      $hdrTitle.textContent = restaurantData.name;
      $hdrSub.textContent = `Role: ${unlockedRole.toUpperCase()}`;
      $hdrActions.innerHTML = `<button id="logoutRoleBtn" class="px-3 py-1.5 rounded-xl theme-card-2 border text-xs font-semibold">Switch Role</button>`;
      document.getElementById('logoutRoleBtn').onclick = () => {
        sessionStorage.removeItem(`role_${restId}`);
        unlockedRole = null;
        renderStaffPinGate();
      };

      const roleTabs = {
        kitchen: [
          { id: 'queue', label: 'Kitchen Queue' },
          { id: 'history', label: 'Completed' }
        ],
        waiter: [
          { id: 'tables', label: 'Tables & Ready' },
          { id: 'take_order', label: 'Take Order' }
        ],
        manager: [
          { id: 'queue', label: 'Live Counter' },
          { id: 'tables', label: 'Tables' },
          { id: 'menu_mgr', label: 'AI Menu & Stock' },
          { id: 'qr_mgr', label: 'Table QRs' }
        ]
      };

      const tabs = roleTabs[unlockedRole] || roleTabs.kitchen;
      if (!tabs.some(t => t.id === activeTab)) activeTab = tabs[0].id;

      $bottomNav.classList.remove('hidden');
      $bottomNavInner.innerHTML = tabs.map(t => `
        <button data-tab="${t.id}" class="flex-1 py-2 px-2 rounded-xl text-xs font-bold transition ${
          activeTab === t.id ? 'theme-card-2 border' : 'theme-muted'
        }">
          ${t.label}
        </button>
      `).join('');
      $bottomNavInner.querySelectorAll('[data-tab]').forEach(btn => {
        btn.onclick = () => { activeTab = btn.dataset.tab; renderStaffWorkspace(); };
      });

      if (activeTab === 'queue') renderLiveQueue(unlockedRole === 'kitchen');
      if (activeTab === 'history') renderOrderHistory();
      if (activeTab === 'tables') renderTableFloor();
      if (activeTab === 'take_order') renderWaiterOrderPad();
      if (activeTab === 'menu_mgr') renderMenuManager();
      if (activeTab === 'qr_mgr') renderRestaurantQRTab();
    }

    function renderLiveQueue(hidePrices) {

    function parseMenuRawText(rawText) {
      const lines = rawText.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      const parsed = [];
      let currentCat = 'Specials';

      for (const line of lines) {
        const match = line.match(/^([A-Za-z0-9 &()\/'-]+?)\s*(?:[-–:.|₹Rs]+\s*)?(\d{2,4})(?:\s*\/-)?$/i);
        if (match) {
          const name = match[1].replace(/[.\-_]+$/g, '').trim();
          const price = Number(match[2]);
          if (name.length >= 2 && price > 0) {
            const media = autoMatchPhotoAndVeg(name);
            parsed.push({
              name,
              price,
              category: currentCat,
              veg: media.veg,
              photo_url: media.photo,
              glb_url: '' // Clean onboarding: NO fake .glb attached automatically
            });
            continue;
          }
        }
        if (!/\d/.test(line) && line.length >= 3 && line.length <= 28) {
          currentCat = line.replace(/[:\-]+$/g, '').trim();
        }
      }
      return parsed;
    }

    async function loadTesseractIfNeeded() {
      if (window.Tesseract) return window.Tesseract;
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
      return window.Tesseract;
    }

          pendingDeleteDishId = null;
          await deleteDoc(doc(db, 'restaurants', restId, 'menu', id));
          showToast('Dish deleted', 'warn');
        };
      });
    }

    function renderAiScannedPreview() {
      const box = document.getElementById('aiPreviewArea');
      if (!box) return;
      if (!aiScannedItems.length) {
        box.innerHTML = '';
        return;
      }
      box.innerHTML = `
        <div class="flex items-center justify-between gap-2 mb-2">
          <strong class="text-xs sm:text-sm">Review Extracted Menu (${aiScannedItems.length} items)</strong>
          <button id="publishAllAiBtn" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white">
            Publish All ${aiScannedItems.length} to Menu
          </button>
        </div>
        <div class="space-y-1.5">
          ${aiScannedItems.map((it, idx) => `
            <div class="grid grid-cols-12 gap-1.5 items-center">
              <input data-ainame="${idx}" value="${escapeHtml(it.name)}" class="col-span-5 px-2.5 py-1.5 rounded-lg theme-card-2 border text-xs" />
              <input data-aiprice="${idx}" type="number" value="${it.price}" class="col-span-2 px-2 py-1.5 rounded-lg theme-card-2 border text-xs" />
              <input data-aicat="${idx}" value="${escapeHtml(it.category)}" class="col-span-4 px-2.5 py-1.5 rounded-lg theme-card-2 border text-xs" />
              <button data-aidel="${idx}" class="col-span-1 py-1.5 rounded-lg theme-card-2 border text-xs font-bold">✕</button>
            </div>
          `).join('')}
        </div>
      `;

      box.querySelectorAll('[data-ainame]').forEach(el => el.oninput = () => { aiScannedItems[el.dataset.ainame].name = el.value; });
      box.querySelectorAll('[data-aiprice]').forEach(el => el.oninput = () => { aiScannedItems[el.dataset.aiprice].price = Number(el.value || 0); });
      box.querySelectorAll('[data-aicat]').forEach(el => el.oninput = () => { aiScannedItems[el.dataset.aicat].category = el.value; });
      box.querySelectorAll('[data-aidel]').forEach(el => el.onclick = () => {
        aiScannedItems.splice(Number(el.dataset.aidel), 1);
        renderAiScannedPreview();
      });

      document.getElementById('publishAllAiBtn').onclick = async () => {
        const btn = document.getElementById('publishAllAiBtn');
        btn.disabled = true;
        btn.textContent = 'Publishing...';
        for (const it of aiScannedItems) {
          if (!it.name || !it.price) continue;
          const auto = autoMatchPhotoAndVeg(it.name);
          await addDoc(collection(db, 'restaurants', restId, 'menu'), {
            name: it.name.trim(),
            description: it.description || '',
            category: it.category.trim() || 'Specials',
            price: Number(it.price),
            veg: it.veg,
            bestseller: false,
            in_stock: true,
            photo_url: it.photo_url || auto.photo,
            glb_url: '' // Clean publish: attach real 3D models via 1-Tap 3D Dish Studio
          });
        }
        const count = aiScannedItems.length;
        aiScannedItems = [];
        showToast(`Published ${count} dishes! Now attach 3D to top items in 3D Dish Studio.`, 'success');
      };
    }

    function renderRestaurantQRTab() {
      const base = `${location.origin}${location.pathname}`;
      const count = Number(restaurantData.table_count || 10);
      const staffUrl = `${base}?r=${encodeURIComponent(restId)}&panel=staff`;

      $app.innerHTML = `
        <div class="theme-card border rounded-2xl p-4 mb-4 space-y-2">
          <div class="flex items-center justify-between gap-2">
            <strong class="text-sm font-bold">Staff Panel Link (Bookmark on Counter Devices)</strong>
            <div class="flex items-center gap-2">
              <button id="copyStaffUrlBtn" class="px-3 py-1.5 rounded-xl theme-card-2 border text-xs font-semibold">Copy Link</button>
              <button onclick="window.print()" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-white" style="background: var(--accent);">Print QRs</button>
            </div>
          </div>
          <div class="text-xs theme-muted break-all theme-card-2 p-2.5 rounded-xl">${escapeHtml(staffUrl)}</div>
        </div>
        <div id="printableQrArea" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5"></div>
      `;

      document.getElementById('copyStaffUrlBtn').onclick = () => {
        const temp = document.createElement('textarea');
        temp.value = staffUrl;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        showToast('Staff panel link copied!', 'success');
      };

      const grid = document.getElementById('printableQrArea');
      for (let t = 1; t <= count; t++) {
        const url = `${base}?r=${encodeURIComponent(restId)}&t=${t}`;
        const box = document.createElement('div');
        box.className = 'bg-white text-slate-900 rounded-2xl p-3.5 flex flex-col items-center justify-center gap-2 shadow';
        box.innerHTML = `
          <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-500">${escapeHtml(restaurantData.name)}</div>
          <strong class="text-base font-black text-slate-900">Table ${t}</strong>
        `;
        const holder = document.createElement('div');
        box.appendChild(holder);
        const hint = document.createElement('div');
        hint.className = 'text-[10px] font-semibold text-slate-500';
        hint.textContent = 'Scan for 3D Menu & Order';
        box.appendChild(hint);
        grid.appendChild(box);
        new QRCode(holder, { text: url, width: 115, height: 115 });
      }
    }

    // ================= 3. SUPER ADMIN PANEL (ONLY VIA ?panel=superadmin) =================
    function renderSuperAdminGate() {
      $hdrTitle.textContent = 'Super Admin Console';
      $hdrSub.textContent = 'Multi-Restaurant Control';
      $app.innerHTML = `
        <div class="max-w-md mx-auto mt-6 theme-card border rounded-3xl p-6 shadow-xl">
          <h3 class="text-lg font-bold">Super Admin Login</h3>
          <p class="text-xs theme-muted mt-1 mb-4">Manage all onboarded restaurants, PINs & subscriptions.</p>
          <input id="saPin" type="password" inputmode="numeric" placeholder="Enter Super Admin PIN" class="w-full px-4 py-3 rounded-xl theme-card-2 border text-base tracking-widest mb-4 focus:outline-none" />
          <button id="saLoginBtn" class="w-full py-3 rounded-xl font-bold text-sm text-white shadow-lg" style="background: var(--accent);">Open Console</button>
        </div>
      `;
      const loginFn = () => {
        if (document.getElementById('saPin').value.trim() !== SUPER_ADMIN_PIN) {
          return showToast('Wrong Super Admin PIN', 'error');
        }
        renderSuperAdminDashboard();
      };
      document.getElementById('saLoginBtn').onclick = loginFn;
      document.getElementById('saPin').onkeydown = (e) => { if (e.key === 'Enter') loginFn(); };
    }

    function renderSuperAdminDashboard() {
      const base = `${location.origin}${location.pathname}`;
      onSnapshot(collection(db, 'restaurants'), (snap) => {
        const clients = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        $app.innerHTML = `
          <div class="theme-card border rounded-2xl p-4 mb-5 space-y-3">
            <h3 class="text-sm font-bold">Onboard New Restaurant</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <input id="saSlug" type="text" placeholder="Slug ID (e.g., spice-hub)" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
              <input id="saName" type="text" placeholder="Restaurant Name" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              <input id="saTables" type="number" value="10" placeholder="Tables" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
              <input id="saColor" type="text" value="#e11d48" placeholder="Hex Color" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
            </div>
            <div class="grid grid-cols-3 gap-2.5">
              <input id="saMgrPin" type="text" value="1111" placeholder="Manager PIN" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
              <input id="saKitPin" type="text" value="2222" placeholder="Kitchen PIN" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
              <input id="saWtrPin" type="text" value="3333" placeholder="Waiter PIN" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
            </div>
            <input id="saReview" type="url" placeholder="Google Review URL" class="w-full px-3.5 py-2.5 rounded-xl theme-card-2 border text-sm" />
            <button id="createClientBtn" class="px-5 py-2.5 rounded-xl text-xs font-bold text-white shadow" style="background: var(--accent);">Create Restaurant</button>
          </div>

          <h3 class="text-sm font-bold uppercase tracking-wide theme-muted mb-3">Onboarded Clients (${clients.length})</h3>
          <div class="space-y-3">
            ${clients.map(c => `
              <div class="theme-card border rounded-2xl p-4">
                <div class="flex items-center justify-between gap-2">
                  <div>
                    <strong class="text-base font-bold">${escapeHtml(c.name)}</strong>
                    <span class="text-xs theme-muted ml-1">(${escapeHtml(c.id)})</span>
                  </div>
                  <button data-cactive="${c.id}" data-cur="${c.active !== false}" class="px-3 py-1 rounded-xl text-xs font-bold text-white ${c.active !== false ? 'bg-emerald-600' : 'bg-amber-600'}">
                    ${c.active !== false ? 'Active' : 'Suspended'}
                  </button>
                </div>
                <div class="text-xs theme-muted mt-1.5">
                  Tables: ${c.table_count || 10} • PINs: M:<strong>${escapeHtml(c.manager_pin)}</strong> / K:<strong>${escapeHtml(c.kitchen_pin)}</strong> / W:<strong>${escapeHtml(c.waiter_pin)}</strong>
                </div>
                <div class="flex items-center gap-2 flex-wrap mt-3 pt-2.5 border-t" style="border-color: var(--border);">
                  <a target="_blank" rel="noopener" href="${base}?r=${encodeURIComponent(c.id)}&t=1" class="px-3 py-1.5 rounded-xl theme-card-2 border text-xs font-semibold">Customer Menu</a>
                  <a target="_blank" rel="noopener" href="${base}?r=${encodeURIComponent(c.id)}&panel=staff" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white">Staff Panel (AI & 3D Studio)</a>
                </div>
              </div>
            `).join('')}
          </div>
        `;

        document.getElementById('createClientBtn').onclick = async () => {
          const id = document.getElementById('saSlug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, '-');
          const name = document.getElementById('saName').value.trim();
          if (!id || !name) return showToast('Slug ID and Name are required', 'error');

          await setDoc(doc(db, 'restaurants', id), {
            name,
            table_count: Number(document.getElementById('saTables').value || 10),
            accent_color: document.getElementById('saColor').value.trim() || '#e11d48',
            manager_pin: document.getElementById('saMgrPin').value.trim() || '1111',
            kitchen_pin: document.getElementById('saKitPin').value.trim() || '2222',
            waiter_pin: document.getElementById('saWtrPin').value.trim() || '3333',
            google_review_url: document.getElementById('saReview').value.trim(),
            active: true
          });

          showToast(`Created ${name}! Open Staff Panel to scan menu & attach 3D.`, 'success');
        };

        $app.querySelectorAll('[data-cactive]').forEach(b => {
          b.onclick = () => {
            const cur = b.dataset.cur === 'true';
            updateDoc(doc(db, 'restaurants', b.dataset.cactive), { active: !cur });
          };
        });
      }, showError);
    }

    boot();
  </script>
</body>
</html>
